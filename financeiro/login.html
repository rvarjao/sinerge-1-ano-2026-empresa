<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login - Nexus Infinity</title>

<link rel="stylesheet" href="login.css">

<!-- Fonte opcional para manter padrão do sistema -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

</head>

<body>

<div class="login-box">

    <h1>Nexus Infinity</h1>
    <p>Área administrativa</p>

    <input type="email" id="email" placeholder="Email" autocomplete="username">
    <input type="password" id="senha" placeholder="Senha" autocomplete="current-password">

    <button id="entrar">Entrar</button>

    <p id="erro" style="color:#ff4d4d; font-size:12px; margin-top:10px;"></p>

</div>

<script src="login.js"></script>

</body>

</html>
