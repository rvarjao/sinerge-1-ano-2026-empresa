<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS INFINITY - Sistema de Relatórios</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f9ff, #e8f1ff);
            color: #1a1a1a;
        }

        /* LOGIN */

        #login {
            width: 380px;
            margin: 100px auto;
            background: rgba(255, 255, 255, 0.95);
            padding: 35px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 102, 255, 0.15);
            border: 1px solid rgba(0, 102, 255, 0.2);
        }

        #login h2 {
            color: #0066ff;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }

        #login p {
            margin-bottom: 20px;
            color: #666;
        }

        #login input,
        .linha input,
        .campo textarea {

            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border: 2px solid #dbe8ff;
            border-radius: 12px;
            transition: 0.3s;

        }

        #login input:focus,
        .linha input:focus,
        .campo textarea:focus {

            outline: none;
            border-color: #0066ff;
            box-shadow: 0 0 15px rgba(0, 102, 255, 0.2);

        }

        #login button,
        .salvar {

            width: 100%;
            padding: 14px;
            background: linear-gradient(90deg, #0066ff, #00a2ff);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;

        }

        #login button:hover,
        .salvar:hover {

            transform: translateY(-2px);

        }

        /* SISTEMA */

        #sistema {
            display: none;
        }

        header {

            background: linear-gradient(90deg, #0044cc, #0080ff);
            color: white;
            text-align: center;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);

        }

        header h1 {
            letter-spacing: 4px;
        }

        .container {
            width: 95%;
            margin: auto;
        }

        main {
            display: flex;
        }

        .menu {

            width: 240px;
            background: white;
            min-height: 100vh;
            padding: 20px;
            border-right: 2px solid #dbe8ff;

        }

        .menu button {

            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: none;
            border-radius: 12px;
            background: #f3f8ff;
            color: #0066ff;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;

        }

        .menu button:hover {

            background: #0066ff;
            color: white;

        }

        .conteudo {

            flex: 1;
            background: white;
            padding: 30px;
            margin: 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 102, 255, 0.08);

        }

        .campo textarea {
            height: 100px;
            resize: vertical;
        }

        .relatorio {

            background: #f8fbff;
            border-left: 6px solid #0066ff;
            padding: 20px;
            margin-top: 15px;
            border-radius: 15px;

        }

        .relatorio button {

            margin-top: 10px;
            margin-right: 10px;
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;

        }

        .relatorio button:first-of-type {
            background: #0066ff;
            color: white;
        }

        .relatorio button:last-of-type {
            background: red;
            color: white;
        }

        footer {

            background: white;
            border-top: 2px solid #dbe8ff;
            text-align: center;
            padding: 20px;
            color: #0066ff;
            font-weight: bold;

        }
    </style>
</head>

<body>

    <div id="login">

        <h2>NEXUS INFINITY</h2>

        <p>Sistema Corporativo de Relatórios</p>

        <input type="email" id="emailLogin" placeholder="Digite seu Gmail" required>

        <input type="password" id="senha" placeholder="Digite sua senha" required>

        <button onclick="entrar()">
            Entrar
        </button>

    </div>

    <div id="sistema">

        <header>

            <h1>NEXUS INFINITY</h1>

            <p>Sistema Corporativo de Relatórios</p>

        </header>

        <div class="container">

            <main>

                <aside class="menu">

                    <button onclick="window.scrollTo(0,0)">
                        Novo Relatório
                    </button>

                    <button onclick="mostrarRelatorios()">
                        Relatórios
                    </button>

                </aside>

                <section class="conteudo">

                    <h2>Novo Relatório</h2>

                    <form id="relatorio">

                        <div class="linha">
                            <label>Setor</label>
                            <input type="text" id="setor" required>
                        </div>

                        <div class="linha">
                            <label>Responsável</label>
                            <input type="text" id="responsavel" required>
                        </div>

                        <div class="linha">
                            <label>Data</label>
                            <input type="date" id="data">
                        </div>

                        <div class="campo">
                            <label>Atividades</label>
                            <textarea id="atividades"></textarea>
                        </div>

                        <div class="campo">
                            <label>Problemas</label>
                            <textarea id="problemas"></textarea>
                        </div>

                        <div class="campo">
                            <label>Soluções</label>
                            <textarea id="solucoes"></textarea>
                        </div>

                        <div class="campo">
                            <label>Observações</label>
                            <textarea id="observacoes"></textarea>
                        </div>

                        <button class="salvar" type="submit">
                            Salvar Relatório
                        </button>

                    </form>

                    <div id="lista"></div>

                </section>

            </main>

        </div>

        <footer>
            Desenvolvido por Guilherme Jachic © 2026 | NEXUS INFINITY
        </footer>

    </div>

    <script>

        const SENHA = "10022011";

        let usuarioLogado = "";

        function entrar() {

            let email = document.getElementById("emailLogin").value;
            let senha = document.getElementById("senha").value;

            if (!email.endsWith("@gmail.com")) {

                alert("Digite um Gmail válido!");
                return;

            }

            if (senha === SENHA) {

                usuarioLogado = email;

                document.getElementById("login").style.display = "none";
                document.getElementById("sistema").style.display = "block";

                document.getElementById("data").valueAsDate = new Date();

                mostrarRelatorios();

            } else {

                alert("Senha incorreta!");

            }

        }

        document.getElementById("relatorio").addEventListener("submit", function (e) {

            e.preventDefault();

            let relatorios = JSON.parse(localStorage.getItem("relatorios")) || [];

            relatorios.push({

                gmail: usuarioLogado,

                setor: document.getElementById("setor").value,
                responsavel: document.getElementById("responsavel").value,
                data: document.getElementById("data").value,
                atividades: document.getElementById("atividades").value,
                problemas: document.getElementById("problemas").value,
                solucoes: document.getElementById("solucoes").value,
                observacoes: document.getElementById("observacoes").value

            });

            localStorage.setItem("relatorios", JSON.stringify(relatorios));

            alert("Relatório salvo com sucesso!");

            this.reset();

            document.getElementById("data").valueAsDate = new Date();

            mostrarRelatorios();

        });

        function mostrarRelatorios() {

            let relatorios = JSON.parse(localStorage.getItem("relatorios")) || [];

            let lista = document.getElementById("lista");

            lista.innerHTML = "<h2 style='margin-top:30px'>Relatórios Salvos</h2>";

            relatorios.forEach((r, i) => {

                lista.innerHTML += `

        <div class="relatorio">

            <p><b>Usuário:</b> ${r.gmail}</p>
            <p><b>Setor:</b> ${r.setor}</p>
            <p><b>Responsável:</b> ${r.responsavel}</p>
            <p><b>Data:</b> ${r.data}</p>
            <p><b>Atividades:</b> ${r.atividades}</p>
            <p><b>Problemas:</b> ${r.problemas}</p>
            <p><b>Soluções:</b> ${r.solucoes}</p>
            <p><b>Observações:</b> ${r.observacoes}</p>

            <button onclick="editar(${i})">
                Editar
            </button>

            <button onclick="excluir(${i})">
                Excluir
            </button>

        </div>

        `;

            });

        }

        function excluir(i) {

            let relatorios = JSON.parse(localStorage.getItem("relatorios")) || [];

            if (confirm("Deseja excluir este relatório?")) {

                relatorios.splice(i, 1);

                localStorage.setItem("relatorios", JSON.stringify(relatorios));

                mostrarRelatorios();

            }

        }

        function editar(i) {

            let relatorios = JSON.parse(localStorage.getItem("relatorios")) || [];

            let r = relatorios[i];

            document.getElementById("setor").value = r.setor;
            document.getElementById("responsavel").value = r.responsavel;
            document.getElementById("data").value = r.data;
            document.getElementById("atividades").value = r.atividades;
            document.getElementById("problemas").value = r.problemas;
            document.getElementById("solucoes").value = r.solucoes;
            document.getElementById("observacoes").value = r.observacoes;

            relatorios.splice(i, 1);

            localStorage.setItem("relatorios", JSON.stringify(relatorios));

            mostrarRelatorios();

        }

    </script>

</body>

</html>
```
